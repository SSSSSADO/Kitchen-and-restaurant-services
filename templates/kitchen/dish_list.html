{% extends "base.html" %}

{% block title %}
  <title>Dish List</title>
{% endblock %}

{% block content %}
  {% if dish_list %}
    <ul>
      {% for dish in dish_list %}
        <li>
          {{ dish.name }} Price: {{ dish.price }}
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <h3>No dishes found</h3>
  {% endif %}
{% endblock %}
