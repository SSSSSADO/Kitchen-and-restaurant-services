{% extends "base.html" %}

{% block title %}
  <title>Dish Type List</title>
{% endblock %}

{% block content %}
  {% if dish_type_list %}
    <ul>
      {% for dish_type in dish_type_list %}
        <li>
          <a href="{{ dish_type.get_absolute_url }}">
            {{ dish_type.name }}
          </a>
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <h3>No dish types found.</h3>
  {% endif %}
{% endblock %}
