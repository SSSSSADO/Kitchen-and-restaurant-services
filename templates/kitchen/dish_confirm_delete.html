{% extends "base.html" %}

{% block title %}
  <title>Delete {{ dish.name }}</title>
{% endblock %}

{% block content %}
  <form method="post">
    <h1>Delete {{ dish.name }}</h1>
    <p>Are you sure you want to delete this dish?</p>
    {% csrf_token %}
    <button type="submit">Yes, delete</button>
    <a href="{{ dish.get_absolute_url }}">Cancel</a>
  </form>
{% endblock %}
