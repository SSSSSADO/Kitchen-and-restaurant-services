{% extends "base.html" %}

{% block title %}
  <title>Cooks List</title>
{% endblock %}

{% block content %}
  {% if cook_list %}
    <ul>
      {% for cook in cook_list %}
        <li>
          <a href="{{ cook.get_absolute_url }}">
            {{ cook.first_name }} {{ cook.last_name }}
          </a>
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <h3>No cooks found</h3>
  {% endif %}
{% endblock %}
